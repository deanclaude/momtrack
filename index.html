<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>媽媽追蹤器</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#6b7280; --accent:#2563eb; --line:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --card:#1b2027; --text:#e8eaed; --muted:#9aa3ad; --accent:#60a5fa; --line:#2c333c; }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family: -apple-system, "Noto Sans TC", "PingFang TC", sans-serif; }
  body { display:flex; flex-direction:column; }
  header { padding:10px 12px; background:var(--card); border-bottom:1px solid var(--line);
    display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  header h1 { font-size:17px; margin:0 auto 0 0; }
  button, input, select { font:inherit; font-size:15px; padding:6px 10px; border-radius:8px;
    border:1px solid var(--line); background:var(--bg); color:var(--text); }
  button { cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  #bar { padding:8px 12px; font-size:14px; color:var(--muted); background:var(--card);
    border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:4px 14px; }
  #bar b { color:var(--text); }
  #map { flex:1; min-height:300px; }
  #settings { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none;
    align-items:center; justify-content:center; padding:16px; z-index:1000; }
  #settings .box { background:var(--card); padding:18px; border-radius:12px; width:100%; max-width:420px; }
  #settings label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  #settings input { width:100%; }
  .row { display:flex; gap:6px; align-items:center; }
  .err { color:#dc2626; }
  .src { display:inline-flex; align-items:center; gap:4px; font-size:14px; cursor:pointer; user-select:none; }
  .src input { width:16px; height:16px; margin:0; padding:0; }
  .dot { width:12px; height:12px; border-radius:50%; display:inline-block; }
</style>
</head>
<body>
<header>
  <h1>👩 媽媽追蹤器</h1>
  <div class="row">
    <button id="prev" aria-label="前一天">◀</button>
    <input type="date" id="date">
    <button id="next" aria-label="後一天">▶</button>
  </div>
  <div class="row">
    <label class="src"><input type="checkbox" id="show-mitag" checked><span class="dot" style="background:#ea580c"></span>MiTag</label>
    <label class="src"><input type="checkbox" id="show-phone" checked><span class="dot" style="background:#2563eb"></span>手機</label>
  </div>
  <div class="row">
    <button id="now" class="primary">最新位置</button>
    <button id="cfg" aria-label="設定">⚙︎</button>
  </div>
</header>
<div id="bar">載入中…</div>
<div id="map"></div>

<div id="settings">
  <div class="box">
    <b>連線設定</b>
    <label>Apps Script 網址（…/exec）</label>
    <input id="api" placeholder="https://script.google.com/macros/s/.../exec">
    <label>Token</label>
    <input id="tok" type="password">
    <label>忽略誤差大於（公尺）的點</label>
    <input id="maxacc" type="number" min="0" step="50">
    <div class="row" style="margin-top:14px; justify-content:flex-end">
      <button id="cancel">取消</button>
      <button id="save" class="primary">儲存</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const TZ = 'Asia/Taipei';
const store = {
  get(k, d) { try { const v = localStorage.getItem('momtrack.' + k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('momtrack.' + k, v); } catch (e) {} }
};
let cfg = { api: store.get('api', ''), tok: store.get('tok', ''), maxacc: +store.get('maxacc', '200') };

const $ = id => document.getElementById(id);
const todayStr = () => new Intl.DateTimeFormat('sv-SE', { timeZone: TZ }).format(new Date());
const shiftDay = (s, n) => { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const fmtTime = t => new Date(t).toLocaleTimeString('zh-TW', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: false });
const fmtFull = t => new Date(t).toLocaleString('zh-TW', { timeZone: TZ, month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
function ago(t) {
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return '剛剛';
  if (m < 60) return m + ' 分鐘前';
  const h = Math.floor(m / 60);
  return h < 48 ? h + ' 小時前' : Math.floor(h / 24) + ' 天前';
}
function dist(a, b) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}

const map = L.map('map').setView([25.04, 121.56], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '© OpenStreetMap'
}).addTo(map);
const layer = L.layerGroup().addTo(map);

async function api(params) {
  const q = new URLSearchParams({ ...params, token: cfg.tok });
  const res = await fetch(cfg.api + '?' + q.toString());
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || '讀取失敗');
  return j;
}

const SRC = {
  mitag: { label: 'MiTag', color: '#ea580c' },
  phone: { label: '手機', color: '#2563eb' }
};
const shown = k => $('show-' + k).checked;
let lastDay = null, lastLatest = null;

function latestBarHtml(latest) {
  if (!latest || !latest.bySource) return '';
  return Object.keys(SRC).filter(k => latest.bySource[k]).map(k => {
    const p = latest.bySource[k];
    const batt = p.batt !== '' && p.batt != null ? ` 🔋${p.batt}%` : '';
    return `<span><span class="dot" style="background:${SRC[k].color}"></span> ${SRC[k].label} 最後 <b>${fmtFull(p.t)}</b>（${ago(p.t)}）${batt}</span>`;
  }).join('');
}

function draw(fit) {
  layer.clearLayers();
  if (!lastDay) return;
  const all = lastDay.points;
  const bounds = [];
  const parts = [`<span>${lastDay.date}</span>`];
  Object.keys(SRC).forEach(k => {
    const raw = all.filter(p => (p.src || 'mitag') === k);
    const pts = raw.filter(p => !(cfg.maxacc > 0 && +p.acc > cfg.maxacc));
    let total = 0;
    for (let i = 1; i < pts.length; i++) total += dist(pts[i - 1], pts[i]);
    const skipped = raw.length - pts.length;
    parts.push(`<span><span class="dot" style="background:${SRC[k].color}"></span> ${SRC[k].label} <b>${pts.length}</b> 點・${(total / 1000).toFixed(1)} km${skipped ? `（略過 ${skipped}）` : ''}</span>`);
    if (!shown(k) || !pts.length) return;
    const c = SRC[k].color;
    const ll = pts.map(p => [p.lat, p.lon]);
    L.polyline(ll, { color: c, weight: 4, opacity: .8, dashArray: k === 'mitag' ? '8 6' : null }).addTo(layer);
    pts.forEach((p, i) => {
      const isFirst = i === 0, isLast = i === pts.length - 1;
      const m = L.circleMarker([p.lat, p.lon], {
        radius: isLast ? 9 : isFirst ? 7 : 4, color: c, fillColor: isFirst ? '#fff' : c,
        fillOpacity: isLast ? .95 : .7, weight: isLast ? 3 : 2
      }).addTo(layer);
      const acc = p.acc !== '' && p.acc != null ? `<br>誤差 ±${Math.round(p.acc)} m` : '';
      const batt = p.batt !== '' && p.batt != null ? `<br>電量 ${p.batt}%` : '';
      m.bindPopup(`<b>${SRC[k].label} ${fmtTime(p.t)}</b>${isFirst ? '（起點）' : isLast ? '（終點）' : ''}${acc}${batt}`);
      bounds.push([p.lat, p.lon]);
    });
    const last = pts[pts.length - 1];
    if (last.acc) L.circle([last.lat, last.lon], { radius: +last.acc, color: c, weight: 1, fillOpacity: .08 }).addTo(layer);
  });
  if (fit && bounds.length) map.fitBounds(L.latLngBounds(bounds).pad(0.2), { maxZoom: 17 });
  $('bar').innerHTML = parts.join('') + latestBarHtml(lastLatest);
}

async function loadDay(date) {
  if (!cfg.api || !cfg.tok) { openSettings(); $('bar').textContent = '請先完成連線設定'; return; }
  $('bar').textContent = '載入中…';
  try {
    const [day, latest] = await Promise.all([api({ action: 'read', date }), api({ action: 'latest' }).catch(() => null)]);
    lastDay = day; lastLatest = latest;
    draw(true);
  } catch (e) {
    layer.clearLayers();
    $('bar').innerHTML = `<span class="err">錯誤：${e.message}</span>`;
  }
}

async function showLatest() {
  try {
    const latest = await api({ action: 'latest' });
    const pick = ['phone', 'mitag'].filter(shown).map(k => latest.bySource && latest.bySource[k]).filter(Boolean)
      .sort((a, b) => b.t - a.t)[0] || latest.point;
    if (!pick) return;
    const d = new Intl.DateTimeFormat('sv-SE', { timeZone: TZ }).format(new Date(pick.t));
    $('date').value = d;
    await loadDay(d);
    map.setView([pick.lat, pick.lon], 16);
  } catch (e) {
    $('bar').innerHTML = `<span class="err">錯誤：${e.message}</span>`;
  }
}

function alertBox(msg) {
  let el = $('cfgerr');
  if (!el) { el = document.createElement('div'); el.id = 'cfgerr'; el.className = 'err'; el.style.marginTop = '10px'; $('save').parentNode.before(el); }
  el.textContent = msg;
}
function openSettings() {
  $('api').value = cfg.api; $('tok').value = cfg.tok; $('maxacc').value = cfg.maxacc;
  $('settings').style.display = 'flex';
}
$('cfg').onclick = openSettings;
$('cancel').onclick = () => $('settings').style.display = 'none';
$('save').onclick = () => {
  const api = $('api').value.trim(), tok = $('tok').value.trim();
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(api)) { alertBox('請貼上完整的 Apps Script 網址（https://script.google.com/…/exec）'); return; }
  if (!tok) { alertBox('請填 Token'); return; }
  cfg = { api, tok, maxacc: +$('maxacc').value || 0 };
  store.set('api', cfg.api); store.set('tok', cfg.tok); store.set('maxacc', String(cfg.maxacc));
  $('settings').style.display = 'none';
  loadDay($('date').value);
};
$('date').onchange = () => loadDay($('date').value);
$('prev').onclick = () => { $('date').value = shiftDay($('date').value, -1); loadDay($('date').value); };
$('next').onclick = () => { $('date').value = shiftDay($('date').value, 1); loadDay($('date').value); };
$('now').onclick = showLatest;
['mitag', 'phone'].forEach(k => {
  const el = $('show-' + k);
  el.checked = store.get('show.' + k, '1') === '1';
  el.onchange = () => { store.set('show.' + k, el.checked ? '1' : '0'); draw(false); };
});

$('date').value = todayStr();
$('date').max = todayStr();
loadDay($('date').value);

// 看今天時，每 5 分鐘自動更新
setInterval(() => { if ($('date').value === todayStr() && $('settings').style.display !== 'flex') loadDay($('date').value); }, 5 * 60 * 1000);
</script>
</body>
</html>
