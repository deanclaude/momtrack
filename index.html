<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>媽媽追蹤器</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#6b7280; --accent:#2563eb; --line:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --card:#1b2027; --text:#e8eaed; --muted:#9aa3ad; --accent:#60a5fa; --line:#2c333c; }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family: -apple-system, "Noto Sans TC", "PingFang TC", sans-serif; }
  body { display:flex; flex-direction:column; }
  header { padding:10px 12px; background:var(--card); border-bottom:1px solid var(--line);
    display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  header h1 { font-size:17px; margin:0 auto 0 0; }
  button, input, select { font:inherit; font-size:15px; padding:6px 10px; border-radius:8px;
    border:1px solid var(--line); background:var(--bg); color:var(--text); }
  button { cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  #bar { padding:8px 12px; font-size:14px; color:var(--muted); background:var(--card);
    border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:4px 14px; }
  #bar b { color:var(--text); }
  #map { flex:1; min-height:300px; }
  #settings { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none;
    align-items:center; justify-content:center; padding:16px; z-index:1000; }
  #settings .box { background:var(--card); padding:18px; border-radius:12px; width:100%; max-width:420px; }
  #settings label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  #settings input { width:100%; }
  .row { display:flex; gap:6px; align-items:center; }
  .err { color:#dc2626; }
  #alerts:empty { display:none; }
  #alerts { padding:8px 12px; display:flex; flex-direction:column; gap:6px; background:var(--card); border-bottom:1px solid var(--line); }
  .alert { border-radius:8px; padding:8px 10px; font-size:14px; line-height:1.45; display:flex; gap:8px; align-items:flex-start; }
  .alert.bad { background:#fee2e2; color:#7f1d1d; }
  .alert.warn { background:#fef3c7; color:#78350f; }
  @media (prefers-color-scheme: dark) {
    .alert.bad { background:#450a0a; color:#fecaca; }
    .alert.warn { background:#451a03; color:#fde68a; }
  }
  .alert b { display:block; }
  .alert .x { margin-left:auto; background:none; border:0; color:inherit; font-size:18px; padding:0 4px; cursor:pointer; }
  .src { display:inline-flex; align-items:center; gap:4px; font-size:14px; cursor:pointer; user-select:none; }
  .src input { width:16px; height:16px; margin:0; padding:0; }
  .dot { width:12px; height:12px; border-radius:50%; display:inline-block; }
  .range { display:flex; flex-wrap:wrap; gap:6px; align-items:center; width:100%; }
  .range .lbl { font-size:13px; color:var(--muted); }
  .range select { padding:6px 4px; }
  .range .seg { display:inline-flex; gap:4px; align-items:center; white-space:nowrap; }
  .arrow-ic { background:none; border:0; }
  .arrow-ic span { display:block; width:14px; height:14px; line-height:14px; text-align:center;
    font-size:15px; font-weight:700; transform-origin:50% 50%; text-shadow:0 0 2px #fff, 0 0 2px #fff; }
</style>
</head>
<body>
<header>
  <h1>👩 媽媽追蹤器</h1>
  <div class="row">
    <label class="src"><input type="checkbox" id="show-mitag" checked><span class="dot" style="background:#ea580c"></span>MiTag</label>
    <label class="src"><input type="checkbox" id="show-phone" checked><span class="dot" style="background:#2563eb"></span>手機</label>
  </div>
  <div class="row">
    <button id="now" class="primary">最新位置</button>
    <button id="cfg" aria-label="設定">⚙︎</button>
  </div>
  <div class="range">
    <select id="preset" aria-label="快速選擇">
      <option value="today">今天</option>
      <option value="24h">最近 24 小時</option>
      <option value="3d">最近 3 天</option>
      <option value="7d">最近 7 天</option>
      <option value="custom">自訂</option>
    </select>
    <span class="seg"><span class="lbl">起</span>
      <select id="fromDay" aria-label="起始日期"></select><select id="fromHour" aria-label="起始時間"></select></span>
    <span class="seg"><span class="lbl">迄</span>
      <select id="toDay" aria-label="結束日期"></select><select id="toHour" aria-label="結束時間"></select></span>
  </div>
</header>
<div id="alerts"></div>
<div id="bar">載入中…</div>
<div id="map"></div>

<div id="settings">
  <div class="box">
    <b>連線設定</b>
    <label>Apps Script 網址（…/exec）</label>
    <input id="api" placeholder="https://script.google.com/macros/s/.../exec">
    <label>Token</label>
    <input id="tok" type="password">
    <label>忽略誤差大於（公尺）的點</label>
    <input id="maxacc" type="number" min="0" step="50">
    <div class="row" style="margin-top:14px; justify-content:flex-end">
      <button id="cancel">取消</button>
      <button id="save" class="primary">儲存</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const TZ = 'Asia/Taipei';
const store = {
  get(k, d) { try { const v = localStorage.getItem('momtrack.' + k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('momtrack.' + k, v); } catch (e) {} }
};
let cfg = { api: store.get('api', ''), tok: store.get('tok', ''), maxacc: +store.get('maxacc', '200') };

const $ = id => document.getElementById(id);
const todayStr = () => new Intl.DateTimeFormat('sv-SE', { timeZone: TZ }).format(new Date());
const shiftDay = (s, n) => { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const fmtTime = t => new Date(t).toLocaleTimeString('zh-TW', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: false });
const fmtFull = t => new Date(t).toLocaleString('zh-TW', { timeZone: TZ, month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
function ago(t) {
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return '剛剛';
  if (m < 60) return m + ' 分鐘前';
  const h = Math.floor(m / 60);
  return h < 48 ? h + ' 小時前' : Math.floor(h / 24) + ' 天前';
}
function dist(a, b) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}

const map = L.map('map').setView([25.04, 121.56], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '© OpenStreetMap'
}).addTo(map);
const layer = L.layerGroup().addTo(map);
const arrowLayer = L.layerGroup().addTo(map);
const tzOff = 8 * 3600e3;                                   // Asia/Taipei，無日光節約
const dayStart = d => Date.parse(d + 'T00:00:00+08:00');
const dayOf = t => new Date(t + tzOff).toISOString().slice(0, 10);
const hourOf = t => new Date(t + tzOff).getUTCHours();

async function api(params) {
  const q = new URLSearchParams({ ...params, token: cfg.tok });
  const res = await fetch(cfg.api + '?' + q.toString());
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || '讀取失敗');
  return j;
}

const SRC = {
  mitag: { label: 'MiTag', color: '#ea580c' },
  phone: { label: '手機', color: '#2563eb' }
};
const shown = k => $('show-' + k).checked;
let lastDay = null, lastLatest = null;

function latestBarHtml(latest) {
  if (!latest || !latest.bySource) return '';
  return Object.keys(SRC).filter(k => latest.bySource[k]).map(k => {
    const p = latest.bySource[k];
    const batt = p.batt !== '' && p.batt != null ? ` 🔋${p.batt}%` : '';
    return `<span><span class="dot" style="background:${SRC[k].color}"></span> ${SRC[k].label} 最後 <b>${fmtFull(p.t)}</b>（${ago(p.t)}）${batt}</span>`;
  }).join('');
}

// 沿線每隔約 45px 畫一個「›」指出行進方向；縮放後重算
let tracks = [];
function drawArrows() {
  arrowLayer.clearLayers();
  const GAP = 45;
  tracks.forEach(({ ll, color }) => {
    const px = ll.map(p => map.latLngToLayerPoint(p));
    let carry = GAP / 2;
    for (let i = 1; i < px.length; i++) {
      const a = px[i - 1], b = px[i];
      const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
      if (len < 1) continue;
      const ang = Math.atan2(dy, dx) * 180 / Math.PI;
      let d = carry;
      if (len < 18) { carry = Math.max(0, carry - len); continue; }   // 太短的段不畫，避免糊在一起
      while (d < len) {
        const pt = L.point(a.x + dx * d / len, a.y + dy * d / len);
        L.marker(map.layerPointToLatLng(pt), {
          interactive: false, keyboard: false,
          icon: L.divIcon({ className: 'arrow-ic', iconSize: [14, 14], iconAnchor: [7, 7],
            html: `<span style="color:${color};transform:rotate(${ang}deg)">›</span>` })
        }).addTo(arrowLayer);
        d += GAP;
      }
      carry = d - len;
    }
  });
}
map.on('zoomend', drawArrows);

function rangeLabel() {
  const f = cur.from, t = cur.to;
  return `${fmtFull(f)} → ${fmtFull(t)}`;
}

function draw(fit) {
  layer.clearLayers();
  tracks = [];
  if (!lastDay) { drawArrows(); return; }
  const all = lastDay.points;
  const bounds = [];
  const parts = [`<span>${rangeLabel()}</span>`];
  Object.keys(SRC).forEach(k => {
    const raw = all.filter(p => (p.src || 'mitag') === k);
    const pts = raw.filter(p => !(cfg.maxacc > 0 && +p.acc > cfg.maxacc));
    let total = 0;
    for (let i = 1; i < pts.length; i++) total += dist(pts[i - 1], pts[i]);
    const skipped = raw.length - pts.length;
    parts.push(`<span><span class="dot" style="background:${SRC[k].color}"></span> ${SRC[k].label} <b>${pts.length}</b> 點・${(total / 1000).toFixed(1)} km${skipped ? `（略過 ${skipped}）` : ''}</span>`);
    if (!shown(k) || !pts.length) return;
    const c = SRC[k].color;
    const ll = pts.map(p => [p.lat, p.lon]);
    L.polyline(ll, { color: c, weight: 2, opacity: .85 }).addTo(layer);
    tracks.push({ ll, color: c });
    pts.forEach((p, i) => {
      const isFirst = i === 0, isLast = i === pts.length - 1;
      const m = L.circleMarker([p.lat, p.lon], {
        radius: isLast ? 7 : isFirst ? 6 : 2.5, color: c, fillColor: isFirst ? '#fff' : c,
        fillOpacity: isLast ? .95 : .8, weight: isLast ? 2.5 : isFirst ? 2 : 1
      }).addTo(layer);
      const acc = p.acc !== '' && p.acc != null ? `<br>誤差 ±${Math.round(p.acc)} m` : '';
      const batt = p.batt !== '' && p.batt != null ? `<br>電量 ${p.batt}%` : '';
      m.bindPopup(`<b>${SRC[k].label} ${fmtFull(p.t)}</b>${isFirst ? '（起點）' : isLast ? '（終點）' : ''}${acc}${batt}`);
      bounds.push([p.lat, p.lon]);
    });
    const last = pts[pts.length - 1];
    if (last.acc) L.circle([last.lat, last.lon], { radius: +last.acc, color: c, weight: 1, fillOpacity: .08 }).addTo(layer);
  });
  if (fit && bounds.length) map.fitBounds(L.latLngBounds(bounds).pad(0.2), { maxZoom: 17 });
  drawArrows();
  $('bar').innerHTML = parts.join('') + latestBarHtml(lastLatest);
}

// ---------- 自動偵錯提醒 ----------
const RUN_STALE_MIN = 30;      // 超過這麼久沒有任何回報 → 排程沒在跑
const PHONE_STALE_H = 6;       // 手機超過這麼久沒新位置 → 提醒
const MITAG_STALE_H = 24;      // MiTag 超過這麼久沒新位置 → 提醒
const dismissed = new Set();

function hintFor(msg) {
  if (/逾時|Timeout/i.test(msg)) return '可能是 Google 推播格式又變了。在 desktop-cupvhiq 跑一次 --debug-findhub，把 debug_findhub.log 交給 Claude 看。';
  if (/找不到名稱|device_name/.test(msg)) return '裝置名稱對不上（可能重新配對或改名）。檢查 config.json 的 device_name。';
  if (/secrets|identity key|owner key|登入|auth|401|403/i.test(msg)) return '登入憑證可能失效，重跑 setup.bat（MiTag）或 mom_setup.bat（手機）的登入步驟。';
  if (/ModuleNotFound/.test(msg)) return 'Python 套件缺失，確認排程用的是 C:\\Claude\\MomTrack\\venv 的 Python。';
  if (/InvalidCookies/.test(msg)) return 'cookies 失效；手機已改用 findhub 方式時，確認 config.json 的 phone.method 是 "findhub"。';
  return '把 momtrack.log 最後幾行交給 Claude 看。';
}

function buildAlerts(statusRes, latest) {
  const out = [];
  if (!statusRes) return out;
  const now = statusRes.now || Date.now();
  const st = statusRes.status || {};
  const names = Object.keys(st);
  if (!names.length) {
    out.push({ id: 'none', lv: 'warn', t: '還沒有收到任何執行狀態', d: '新版 momtrack.py 執行過一次後就會出現。若一直如此，確認電腦端已換成新版。' });
    return out;
  }
  const lastRun = Math.max(...names.map(k => st[k].t || 0));
  if (now - lastRun > RUN_STALE_MIN * 60e3) {
    out.push({ id: 'stale', lv: 'bad', t: `排程停了：最後一次執行是 ${ago(lastRun)}`,
      d: 'desktop-cupvhiq 可能關機、睡眠或沒網路，或工作排程器 MomTrack 停了。' });
  }
  Object.keys(SRC).forEach(k => {
    const s = st[k];
    if (s && s.ok === false) {
      const since = s.firstFail ? `（從 ${fmtFull(s.firstFail)} 起連續 ${s.fails} 次）` : '';
      out.push({ id: 'fail-' + k + '-' + (s.firstFail || ''), lv: s.fails >= 2 ? 'bad' : 'warn',
        t: `${SRC[k].label} 抓取失敗${since}`, d: `${s.msg}<br>👉 ${hintFor(s.msg)}` });
    }
  });
  const by = (latest && latest.bySource) || {};
  [['phone', PHONE_STALE_H, '手機可能關機、沒網路，或定位被關閉。'],
   ['mitag', MITAG_STALE_H, 'MiTag 可能沒電，或附近沒有 Android 手機經過。']].forEach(([k, h, why]) => {
    const p = by[k];
    if (st[k] && st[k].ok && p && now - p.t > h * 3600e3) {
      out.push({ id: 'old-' + k + '-' + p.t, lv: 'warn', t: `${SRC[k].label} 很久沒有新位置：最後一筆是 ${ago(p.t)}`, d: `程式正常，但沒有新資料。${why}` });
    }
  });
  return out;
}

function renderAlerts(list) {
  const box = $('alerts');
  box.innerHTML = '';
  list.filter(a => !dismissed.has(a.id)).forEach(a => {
    const el = document.createElement('div');
    el.className = 'alert ' + a.lv;
    el.innerHTML = `<span>${a.lv === 'bad' ? '⚠️' : '💡'}</span><span><b>${a.t}</b>${a.d}</span>`;
    const x = document.createElement('button');
    x.className = 'x'; x.textContent = '×'; x.setAttribute('aria-label', '關閉提醒');
    x.onclick = () => { dismissed.add(a.id); el.remove(); };
    el.appendChild(x);
    box.appendChild(el);
  });
}

let cur = { from: 0, to: 0 };
let knownDays = [];

async function fetchRange(from, to) {
  try {
    return (await api({ action: 'range', from, to })).points;
  } catch (e) {
    if (!/unknown action/.test(e.message)) throw e;
    // 舊版 Code.gs 沒有 range：逐日讀再篩選（最多 31 天）
    const pts = [];
    for (let d = dayOf(from), n = 0; d <= dayOf(to) && n < 31; d = shiftDay(d, 1), n++) {
      (await api({ action: 'read', date: d })).points.forEach(p => { if (p.t >= from && p.t <= to) pts.push(p); });
    }
    return pts.sort((x, y) => x.t - y.t);
  }
}

async function load(fit = true) {
  if (!cfg.api || !cfg.tok) { openSettings(); $('bar').textContent = '請先完成連線設定'; return; }
  if (cur.from > cur.to) { $('bar').innerHTML = '<span class="err">起始時間晚於結束時間</span>'; return; }
  $('bar').textContent = '載入中…';
  try {
    const [points, latest, status] = await Promise.all([
      fetchRange(cur.from, cur.to),
      api({ action: 'latest' }).catch(() => null),
      api({ action: 'status' }).catch(() => null)
    ]);
    lastDay = { points }; lastLatest = latest;
    draw(fit);
    renderAlerts(buildAlerts(status, latest));
  } catch (e) {
    layer.clearLayers(); arrowLayer.clearLayers();
    $('bar').innerHTML = `<span class="err">錯誤：${e.message}</span>`;
  }
}

// ---------- 起迄下拉選單 ----------
function fillDays() {
  const today = todayStr();
  const set = new Set(knownDays);
  for (let i = 0; i < 7; i++) set.add(shiftDay(today, -i));      // 最近 7 天一定可選
  if (cur.from) set.add(dayOf(cur.from));
  if (cur.to) set.add(dayOf(cur.to));
  const days = [...set].filter(d => d <= today).sort().reverse();
  const wk = '日一二三四五六';
  const opts = days.map(d => {
    const w = wk[new Date(d + 'T00:00:00Z').getUTCDay()];
    const mark = knownDays.includes(d) ? '' : '（無資料）';
    return `<option value="${d}">${d.slice(5).replace('-', '/')}（${w}）${mark}</option>`;
  }).join('');
  $('fromDay').innerHTML = opts; $('toDay').innerHTML = opts;
}
function fillHours() {
  const h = n => String(n).padStart(2, '0');
  $('fromHour').innerHTML = [...Array(24)].map((_, i) => `<option value="${i}">${h(i)}:00</option>`).join('');
  $('toHour').innerHTML = [...Array(24)].map((_, i) => `<option value="${i}">${h(i)}:59</option>`).join('');
}
function syncSelects() {
  fillDays();
  $('fromDay').value = dayOf(cur.from); $('fromHour').value = hourOf(cur.from);
  $('toDay').value = dayOf(cur.to);     $('toHour').value = hourOf(cur.to);
}
function applyPreset(p) {
  const now = Date.now();
  const endOfHour = Math.floor((now + tzOff) / 3600e3) * 3600e3 - tzOff + 3600e3 - 1;
  if (p === 'today') cur = { from: dayStart(todayStr()), to: dayStart(todayStr()) + 86400e3 - 1 };
  else if (p === '24h') cur = { from: endOfHour + 1 - 24 * 3600e3, to: endOfHour };
  else if (p === '3d') cur = { from: dayStart(shiftDay(todayStr(), -2)), to: dayStart(todayStr()) + 86400e3 - 1 };
  else if (p === '7d') cur = { from: dayStart(shiftDay(todayStr(), -6)), to: dayStart(todayStr()) + 86400e3 - 1 };
  syncSelects();
}
function readSelects() {
  cur = {
    from: dayStart($('fromDay').value) + (+$('fromHour').value) * 3600e3,
    to: dayStart($('toDay').value) + (+$('toHour').value) * 3600e3 + 3600e3 - 1
  };
}
['fromDay', 'fromHour', 'toDay', 'toHour'].forEach(id => $(id).onchange = () => {
  $('preset').value = 'custom'; store.set('preset', 'custom');
  readSelects(); load();
});
$('preset').onchange = () => {
  const p = $('preset').value; store.set('preset', p);
  if (p !== 'custom') { applyPreset(p); load(); }
};

async function showLatest() {
  try {
    const latest = await api({ action: 'latest' });
    const pick = ['phone', 'mitag'].filter(shown).map(k => latest.bySource && latest.bySource[k]).filter(Boolean)
      .sort((a, b) => b.t - a.t)[0] || latest.point;
    if (!pick) return;
    const d = dayOf(pick.t);
    $('preset').value = d === todayStr() ? 'today' : 'custom';
    cur = { from: dayStart(d), to: dayStart(d) + 86400e3 - 1 };
    syncSelects();
    await load(false);
    map.setView([pick.lat, pick.lon], 16);
  } catch (e) {
    $('bar').innerHTML = `<span class="err">錯誤：${e.message}</span>`;
  }
}

function alertBox(msg) {
  let el = $('cfgerr');
  if (!el) { el = document.createElement('div'); el.id = 'cfgerr'; el.className = 'err'; el.style.marginTop = '10px'; $('save').parentNode.before(el); }
  el.textContent = msg;
}
function openSettings() {
  $('api').value = cfg.api; $('tok').value = cfg.tok; $('maxacc').value = cfg.maxacc;
  $('settings').style.display = 'flex';
}
$('cfg').onclick = openSettings;
$('cancel').onclick = () => $('settings').style.display = 'none';
$('save').onclick = () => {
  const api = $('api').value.trim(), tok = $('tok').value.trim();
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(api)) { alertBox('請貼上完整的 Apps Script 網址（https://script.google.com/…/exec）'); return; }
  if (!tok) { alertBox('請填 Token'); return; }
  cfg = { api, tok, maxacc: +$('maxacc').value || 0 };
  store.set('api', cfg.api); store.set('tok', cfg.tok); store.set('maxacc', String(cfg.maxacc));
  $('settings').style.display = 'none';
  init();
};
$('now').onclick = showLatest;
['mitag', 'phone'].forEach(k => {
  const el = $('show-' + k);
  el.checked = store.get('show.' + k, '1') === '1';
  el.onchange = () => { store.set('show.' + k, el.checked ? '1' : '0'); draw(false); };
});

fillHours();
async function init() {
  const p = store.get('preset', 'today');
  $('preset').value = p === 'custom' ? 'today' : p;      // 自訂區間不跨次保留，重開回到預設
  applyPreset($('preset').value);
  load();
  if (cfg.api && cfg.tok) {
    try { knownDays = (await api({ action: 'days' })).days || []; syncSelects(); } catch (e) {}
  }
}
init();

// 區間包含現在時，每 5 分鐘自動更新（快速選項會跟著往後滑）
setInterval(() => {
  if ($('settings').style.display === 'flex' || cur.to < Date.now() - 3600e3) return;
  const p = $('preset').value;
  if (p !== 'custom') applyPreset(p);
  load(false);
}, 5 * 60 * 1000);
</script>
</body>
